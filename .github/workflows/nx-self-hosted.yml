name: real-nx-quality-gate

on:
  workflow_dispatch:
    inputs:
      nx_home:
        description: 'Pinned Siemens NX/Designcenter installation root; leave empty to use repository variable NXGO_NX_HOME'
        required: false
        type: string

permissions:
  contents: read

jobs:
  real-nx:
    runs-on: [self-hosted, windows, x64, nxgo]
    timeout-minutes: 30
    env:
      NXGO_NX_HOME: ${{ inputs.nx_home || vars.NXGO_NX_HOME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Resolve pinned NX managed assemblies
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NXGO_NX_HOME)) {
            throw 'NXGO_NX_HOME is required for the real-NX gate.'
          }
          $candidates = @(
            (Join-Path $env:NXGO_NX_HOME 'NXBIN\managed'),
            (Join-Path $env:NXGO_NX_HOME 'UGII\managed')
          )
          $managed = $candidates | Where-Object { Test-Path (Join-Path $_ 'NXOpen.dll') } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($managed)) {
            throw "NXOpen.dll was not found below pinned NX root $env:NXGO_NX_HOME"
          }
          $agentBin = Join-Path $env:GITHUB_WORKSPACE 'agent\bin'
          "NXGO_NX_MANAGED=$managed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NXGO_AGENT_BIN=$agentBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Pinned NX managed assemblies: $managed"
          Write-Host "Canonical Agent bin: $agentBin"
      - name: Build canonical and legacy parity Agents
        shell: pwsh
        run: ./scripts/build-agent.ps1
      - name: Invariant gate
        shell: pwsh
        run: go run ./cmd/invariantcheck
      - name: Real Siemens NX semantic suite
        shell: pwsh
        run: go run ./cmd/nxctl test nx
      - name: Upload NX diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nx-smoke-${{ github.run_id }}
          path: artifacts/nx-smoke/**
          if-no-files-found: warn
