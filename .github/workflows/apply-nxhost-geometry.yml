name: apply-nxhost-geometry-wiring

on:
  push:
    branches: [main]
    paths:
      - tools/nxhost_geometry.trigger

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply deterministic geometry router wiring
        run: python3 tools/apply_nxhost_geometry_wiring.py
      - name: Verify canonical geometry wiring
        run: |
          grep -Fq 'public static partial class EntryPoint' agent/NXGO.Agent.NXHost/EntryPoint.cs
          grep -Fq 'case "feature.create_block":' agent/NXGO.Agent.NXHost/EntryPoint.cs
          grep -Fq 'case "feature.create_cylinder":' agent/NXGO.Agent.NXHost/EntryPoint.cs
          grep -Fq 'case "part.query_bodies":' agent/NXGO.Agent.NXHost/EntryPoint.cs
          grep -Fq 'case "geometry.query_mass_properties":' agent/NXGO.Agent.NXHost/EntryPoint.cs
          grep -Fq 'case "geometry.query_bounding_box":' agent/NXGO.Agent.NXHost/EntryPoint.cs
          grep -Fq 'case "object.release":' agent/NXGO.Agent.NXHost/EntryPoint.cs
          grep -Fq '"geometry.query_mass_properties",' agent/NXGO.Agent.NXHost/EntryPoint.cs
          grep -Fq '"geometry.query_bounding_box",' agent/NXGO.Agent.NXHost/EntryPoint.cs
      - name: Canonical fast loop
        run: go run ./cmd/nxctl test fast
      - name: Commit canonical geometry router
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent/NXGO.Agent.NXHost/EntryPoint.cs
          git diff --cached --quiet && exit 0
          git commit -m 'feat(nxhost): wire canonical geometry operations'
          git push origin HEAD:main
