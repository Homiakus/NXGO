name: apply-protocol-v2

on:
  push:
    branches: [main]
    paths:
      - tools/protocol_v2.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply protocol v2 boundary
        run: python3 tools/apply_protocol_v2.py
      - name: Verify protocol markers
        run: |
          grep -q 'CurrentProtocolMajor = 2' internal/protocol/messages.go
          grep -q 'Generation   uint32 `json:"generation"`' internal/protocol/messages.go
          grep -q '\\"major\\":2' agent/bundle/AgentWorker.cs
          grep -q 'v0.2.0-realnx' agent/bundle/AgentWorker.cs
      - name: Canonical fast loop
        run: go run ./cmd/nxctl test fast
      - name: Commit v2 contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/protocol/messages.go internal/protocol/version2_contract_test.go agent/bundle/AgentWorker.cs
          git diff --cached --quiet && exit 0
          git commit -m 'feat(protocol): make generation handles a v2 boundary'
          git push origin HEAD:main
