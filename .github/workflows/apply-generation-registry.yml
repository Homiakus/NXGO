name: apply-generation-aware-registry

on:
  push:
    branches: [main]
    paths:
      - tools/generation_registry.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply generation-aware registry patch
        run: python3 tools/apply_generation_registry.py
      - name: Verify generation and quota markers
        run: |
          grep -q 'Generation   uint32 `json:"generation"`' internal/protocol/messages.go
          grep -q 'ref.Generation == 0' pkg/nxgo/objectref.go
          grep -q '\\"generation\\":{3}' agent/bundle/AgentWorker.cs
          grep -q 'stale object generation' agent/bundle/AgentWorker.cs
          grep -q 'new ObjectRegistry(_sessionId, 1, 4096)' agent/bundle/AgentWorker.cs
          grep -q 'object registry capacity reached' agent/bundle/AgentWorker.cs
      - name: Canonical fast loop
        run: go run ./cmd/nxctl test fast
      - name: Commit generation-aware registry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/protocol/messages.go pkg/nxgo/objectref.go pkg/nxgo/objectref_test.go agent/bundle/AgentWorker.cs internal/agentbundle/hardening_test.go
          git diff --cached --quiet && exit 0
          git commit -m 'feat(objectref): add generation-aware bounded registry'
          git push origin HEAD:main
