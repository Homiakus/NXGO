name: fast-quality-gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Canonical fast loop
        run: go run ./cmd/nxctl test fast
      - name: Fake-Agent chaos contract
        run: go run ./cmd/nxctl test chaos
