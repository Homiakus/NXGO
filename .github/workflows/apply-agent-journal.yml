name: apply-production-agent-journal

on:
  push:
    branches: [main]
    paths:
      - tools/agent_journal.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  journal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply deterministic production mutation journal
        run: python3 tools/apply_agent_journal.py
      - name: Verify mutation-journal markers
        run: |
          grep -q 'public sealed class MutationJournal' agent/bundle/AgentWorker.cs
          grep -q 'ReturnCommitted' agent/bundle/AgentWorker.cs
          grep -q 'Journal.MarkCommitted(reqId, executionResult)' agent/bundle/AgentWorker.cs
          grep -q 'previous execution outcome is unknown; request must not be replayed' agent/bundle/AgentWorker.cs
          grep -q 'CANCELLED_BEFORE_START' agent/bundle/AgentWorker.cs
      - name: Canonical fast loop
        run: go run ./cmd/nxctl test fast
      - name: Commit journaled production Agent
        run: |
          if git diff --quiet -- agent/bundle/AgentWorker.cs; then
            echo 'AgentWorker.cs already journaled; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent/bundle/AgentWorker.cs
          git commit -m 'feat(agent): add production mutation outcome journal'
          git push origin HEAD:main
